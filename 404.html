<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page not found — Talha Sandhu</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="stylesheet" href="style.css">
<style>
  .not-found {
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px;
  }
  .not-found .code {
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 14px;
  }
  .not-found h1 {
    font-size: 30px;
    margin: 0 0 12px;
    letter-spacing: -0.02em;
  }
  .not-found p {
    color: var(--text-muted);
    font-size: 16.5px;
    max-width: 440px;
    margin: 0 0 26px;
  }
</style>
</head>
<body>

<div class="not-found">
  <div class="code">404</div>
  <h1>This page went somewhere it shouldn't have</h1>
  <p>The page you're looking for doesn't exist, or the link is out of date. Let's get you back to solid ground.</p>
  <div class="btn-row">
    <a class="btn primary" href="index.html">Back to home</a>
    <a class="btn" href="index.html#projects">See projects</a>
  </div>
</div>

<script src="script.js"></script>
</body>
</html>
